name: Update GitHub Action Versions

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches:
        - main
    paths:
        - "website/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-action-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: node

      - name: Update Action version registry
        run: node .github/scripts/update-action-versions.js

      - name: Apply Action versions to workflows
        run: node .github/scripts/apply-action-versions.js

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Action versions
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/action-versions.json .github/workflows

          git commit -m "chore: update GitHub Action versions"
          git push
